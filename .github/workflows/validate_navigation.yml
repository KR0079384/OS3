name: Validate Navigation Metadata

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-navigation:
    name: Validate Navigation System
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Navigation Validator
        run: python scripts/validate_wiki.py
